us_recipies:
  target: dev
  outputs:
    dev:
      type: athena
      # Where Athena dumps temporary query results
      s3_staging_dir: s3://us-recipies-bronze-v1/athena-staging/
      
      # Where dbt writes your actual Silver and Gold Iceberg tables
      s3_data_dir: s3://us-recipies-bronze-v1/iceberg-warehouse/
      
      region_name: ap-south-2
      schema: silver_recipes
      database: awsdatacatalog 
      threads: 4
      aws_profile_name: default